name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: devtrail_ci
          POSTGRES_PASSWORD: devtrail_ci_fixture
          POSTGRES_DB: devtrail_test_ci
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U devtrail_ci -d devtrail_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26.13.1'
          package-manager-cache: false
      - run: npm ci
      - run: npm run db:validate
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:db
        env:
          TEST_DATABASE_URL: postgresql://devtrail_ci:devtrail_ci_fixture@127.0.0.1:${{ job.services.postgres.ports[5432] }}/devtrail_test_ci
      - run: npm run build
